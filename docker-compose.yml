services:
  web:
    build:
      context: .
      target: web
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 2s
      timeout: 3s
      retries: 15

  # 一次性验收服务：docker compose run --rm verify
  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      BASE_URL: http://web:80
